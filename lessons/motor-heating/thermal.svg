<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Where a winding's heat goes: into its own mass, and out to the air</text>
  <!-- source -->
  <rect x="50" y="120" width="140" height="70" rx="10" fill="#1d2630" stroke="#f5d24b" stroke-width="2.5"/>
  <text x="120" y="150" font-size="15" fill="#f5d24b" text-anchor="middle">I²·R</text>
  <text x="120" y="172" font-size="12" fill="#99a6b5" text-anchor="middle">heat made</text>
  <line x1="190" y1="155" x2="270" y2="155" stroke="#de9454" stroke-width="3"/><path d="M276,155 l-10,-6 l0,12 z" fill="#de9454"/>
  <!-- node -->
  <circle cx="320" cy="155" r="42" fill="#3a1d16" stroke="#de9454" stroke-width="3"/>
  <text x="320" y="152" font-size="14" fill="#e6ebf1" text-anchor="middle">winding</text>
  <text x="320" y="170" font-size="13" fill="#de9454" text-anchor="middle">T</text>
  <!-- capacitance -->
  <line x1="320" y1="197" x2="320" y2="240" stroke="#de9454" stroke-width="2.5"/>
  <rect x="270" y="240" width="100" height="40" rx="6" fill="#1a2129" stroke="#de9454"/>
  <text x="320" y="265" font-size="13" fill="#e6ebf1" text-anchor="middle">stores: C</text>
  <!-- conductance -->
  <line x1="362" y1="155" x2="440" y2="155" stroke="#de9454" stroke-width="3"/>
  <rect x="440" y="130" width="130" height="50" rx="6" fill="#1a2129" stroke="#4dd4bf"/>
  <text x="505" y="160" font-size="13" fill="#4dd4bf" text-anchor="middle">to air: G</text>
  <line x1="570" y1="155" x2="630" y2="155" stroke="#4dd4bf" stroke-width="3"/><path d="M636,155 l-10,-6 l0,12 z" fill="#4dd4bf"/>
  <text x="690" y="160" font-size="14" fill="#99a6b5" text-anchor="middle">room, 20 °C</text>
  <!-- formulas -->
  <text x="505" y="222" font-size="14" fill="#e6ebf1" text-anchor="middle">settles at ΔT = P / G</text>
  <text x="505" y="248" font-size="14" fill="#e6ebf1" text-anchor="middle">takes about τ = C / G to get there</text>
  <text x="24" y="312" font-size="12.5" fill="#99a6b5">Our motor: C = 9 J/K, G = 0.15 W/K, so τ = 60 s. Short bursts are soaked up by C; long running is limited by G.</text>
</svg>
