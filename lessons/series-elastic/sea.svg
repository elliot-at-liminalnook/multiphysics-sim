<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">A series-elastic actuator: motor, gearbox, spring, then the arm</text>
  <!-- motor+gearbox block -->
  <rect x="50" y="110" width="170" height="90" rx="10" fill="#1d2630" stroke="#de9454" stroke-width="2.5"/>
  <text x="135" y="148" font-size="15" fill="#de9454" text-anchor="middle">motor + 100:1</text>
  <text x="135" y="172" font-size="12.5" fill="#99a6b5" text-anchor="middle">rotor feels like 0.05 kg·m²</text>
  <!-- shaft -->
  <line x1="220" y1="155" x2="280" y2="155" stroke="#e6ebf1" stroke-width="4"/>
  <!-- spring (zigzag) -->
  <polyline points="280,155 292,135 308,175 324,135 340,175 356,135 372,175 388,135 400,155" fill="none" stroke="#4dd4bf" stroke-width="3"/>
  <text x="340" y="112" font-size="15" fill="#4dd4bf" text-anchor="middle">spring k</text>
  <line x1="400" y1="155" x2="450" y2="155" stroke="#e6ebf1" stroke-width="4"/>
  <!-- arm -->
  <circle cx="470" cy="155" r="18" fill="#1d2630" stroke="#8fb3e8" stroke-width="2.5"/>
  <line x1="470" y1="155" x2="640" y2="95" stroke="#8fb3e8" stroke-width="10" stroke-linecap="round"/>
  <text x="600" y="140" font-size="14" fill="#8fb3e8">arm, 0.0043 kg·m²</text>
  <!-- encoders -->
  <text x="250" y="210" font-size="12.5" fill="#99a6b5" text-anchor="middle">θ_motor</text>
  <text x="430" y="210" font-size="12.5" fill="#99a6b5" text-anchor="middle">θ_arm</text>
  <rect x="190" y="236" width="380" height="64" rx="8" fill="#1a2129" stroke="#2e353f"/>
  <text x="380" y="264" font-size="16" fill="#e6ebf1" text-anchor="middle">τ = k·(θ_motor − θ_arm)</text>
  <text x="380" y="287" font-size="12" fill="#99a6b5" text-anchor="middle">two encoders and a known spring make a torque sensor</text>
</svg>
