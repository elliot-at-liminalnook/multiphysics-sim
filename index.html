<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Redline Site</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1eb; color: #202024; }
    main { width: min(680px, calc(100% - 40px)); padding: 56px; border: 1px solid #ddd7cd; border-radius: 24px; background: #fffdf9; box-shadow: 0 24px 70px rgba(39, 34, 27, .09); }
    .eyebrow { margin: 0 0 16px; color: #d64d36; font-size: .78rem; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font: 700 clamp(2.4rem, 8vw, 5rem)/.95 Georgia, serif; letter-spacing: -.045em; }
    .intro { max-width: 48ch; margin: 24px 0 0; color: #625e58; font-size: 1.08rem; line-height: 1.65; }
    code { padding: .15em .4em; border-radius: .35em; background: #eee9e1; color: #423d36; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Redline starter</p>
    <h1>Shape this page.</h1>
    <p class="intro">Use the Redline controls in the lower-right corner to select this content and tell Claude what you want to build. This starter lives entirely in <code>index.html</code>.</p>
  </main>
</body>
</html>
