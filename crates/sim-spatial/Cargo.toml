[package]
name = "sim-spatial"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
sim-model-context = { path = "../sim-model-context" }
sim-agent = { path = "../sim-agent" }
sim-markdown = { path = "../sim-markdown" }
sim-render = { path = "../sim-render" }
sim-api = { path = "../sim-api" }
serde.workspace = true
# Match the existing spatial host, without audio/gamepad/animation dependencies.
bevy = { version = "=0.16.1", default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_render", "bevy_pbr", "bevy_gizmos", "bevy_ui", "bevy_winit", "bevy_mesh_picking_backend", "bevy_ui_picking_backend", "default_font", "png", "jpeg", "x11"] }
sim-inspect = { path = "../sim-inspect" }
sim-diagram = { path = "../sim-diagram" }
sim-core = { path = "../sim-core" }
sim-compile = { path = "../sim-compile" }
sim-runtime = { path = "../sim-runtime" }
sim-domain-robot = { path = "../sim-domain-robot" }
sim-system = { path = "../sim-system" }
sim-parts = { path = "../sim-parts" }
sim-lesson = { path = "../sim-lesson" }
sim-annotate = { path = "../sim-annotate" }
sim-script = { path = "../sim-script" }
sim-voice = { path = "../sim-voice" }
serde_json.workspace = true
clap.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }
