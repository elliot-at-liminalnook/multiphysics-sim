<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="358" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Pulling the tail presses its slanted flanks, which push the socket walls apart</text>
  <!-- socket (blue) with undercut groove -->
  <path d="M110,300 L110,110 L300,110 L270,230 L490,230 L460,110 L650,110 L650,300 Z" fill="#3375b8" fill-opacity="0.35" stroke="#3375b8" stroke-width="2"/>
  <text x="130" y="290" font-size="13" fill="#6fa6dc">socket part</text>
  <!-- tail (orange) -->
  <path d="M300,110 L270,230 L490,230 L460,110 L420,110 L420,60 L340,60 L340,110 Z" fill="#ed8c29" fill-opacity="0.4" stroke="#ed8c29" stroke-width="2"/>
  <text x="380" y="190" font-size="13" fill="#ed8c29" text-anchor="middle">tail</text>
  <!-- pull arrow -->
  <line x1="380" y1="58" x2="380" y2="20" stroke="#f2c14e" stroke-width="3"/><path d="M380,20 l-6,12 l12,0 z" fill="#f2c14e"/>
  <text x="392" y="30" font-size="13" fill="#f2c14e">pull F</text>
  <!-- flank normal N on right flank -->
  <line x1="468" y1="170" x2="520" y2="183" stroke="#e6ebf1" stroke-width="2.4"/><path d="M520,183 l-12,-7 l-3,11 z" fill="#e6ebf1"/>
  <text x="528" y="186" font-size="13" fill="#e6ebf1">N</text>
  <!-- spreading S on wall -->
  <line x1="600" y1="160" x2="690" y2="160" stroke="#ff7b72" stroke-width="3"/><path d="M690,160 l-12,-6 l0,12 z" fill="#ff7b72"/>
  <text x="640" y="150" font-size="13" fill="#ff7b72" text-anchor="middle">wall pushed out: S</text>
  <line x1="160" y1="160" x2="70" y2="160" stroke="#ff7b72" stroke-width="3"/><path d="M70,160 l12,-6 l0,12 z" fill="#ff7b72"/>
  <!-- angle alpha -->
  <line x1="460" y1="110" x2="460" y2="200" stroke="#9fb3c8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M460,160 A50,50 0 0,0 470,158" fill="none" stroke="#9fb3c8" stroke-width="1.5"/>
  <text x="438" y="150" font-size="14" fill="#9fb3c8">α</text>
  <text x="380" y="340" font-size="13" fill="#9fb3c8" text-anchor="middle">α is each flank's angle from the pull. The tail slides in and out along the groove (into the page).</text>
</svg>
