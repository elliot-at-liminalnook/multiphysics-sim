<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">A current loop: measure the current, adjust the voltage, hold the torque</text>
  <!-- target -->
  <text x="60" y="140" font-size="14" fill="#e6ebf1">target i*</text>
  <line x1="130" y1="135" x2="180" y2="135" stroke="#e6ebf1" stroke-width="2"/><path d="M186,135 l-9,-5 l0,10 z" fill="#e6ebf1"/>
  <circle cx="200" cy="135" r="14" fill="none" stroke="#e6ebf1" stroke-width="2"/><text x="200" y="140" font-size="14" fill="#e6ebf1" text-anchor="middle">−</text>
  <line x1="214" y1="135" x2="260" y2="135" stroke="#e6ebf1" stroke-width="2"/><path d="M266,135 l-9,-5 l0,10 z" fill="#e6ebf1"/>
  <text x="238" y="125" font-size="12" fill="#99a6b5" text-anchor="middle">error</text>
  <rect x="268" y="110" width="100" height="50" rx="8" fill="#1d2630" stroke="#4dd4bf" stroke-width="2.5"/>
  <text x="318" y="140" font-size="14" fill="#4dd4bf" text-anchor="middle">PI</text>
  <line x1="368" y1="135" x2="410" y2="135" stroke="#e6ebf1" stroke-width="2"/><path d="M416,135 l-9,-5 l0,10 z" fill="#e6ebf1"/>
  <rect x="418" y="110" width="100" height="50" rx="8" fill="#1d2630" stroke="#de9454" stroke-width="2.5"/>
  <text x="468" y="133" font-size="13" fill="#de9454" text-anchor="middle">H-bridge</text>
  <text x="468" y="150" font-size="11.5" fill="#99a6b5" text-anchor="middle">voltage u·V</text>
  <line x1="518" y1="135" x2="570" y2="135" stroke="#e6ebf1" stroke-width="2"/><path d="M576,135 l-9,-5 l0,10 z" fill="#e6ebf1"/>
  <circle cx="610" cy="135" r="30" fill="#1d2630" stroke="#99a6b5" stroke-width="2.5"/><text x="610" y="140" font-size="14" fill="#e6ebf1" text-anchor="middle">M</text>
  <text x="610" y="190" font-size="12.5" fill="#99a6b5" text-anchor="middle">τ = k·i</text>
  <!-- feedback -->
  <line x1="640" y1="135" x2="700" y2="135" stroke="#e6ebf1" stroke-width="2"/>
  <line x1="700" y1="135" x2="700" y2="230" stroke="#f5d24b" stroke-width="2"/>
  <line x1="700" y1="230" x2="200" y2="230" stroke="#f5d24b" stroke-width="2"/>
  <line x1="200" y1="230" x2="200" y2="155" stroke="#f5d24b" stroke-width="2"/><path d="M200,149 l-5,9 l10,0 z" fill="#f5d24b"/>
  <text x="450" y="250" font-size="12.5" fill="#f5d24b" text-anchor="middle">measured current i (shunt)</text>
  <text x="24" y="284" font-size="12.5" fill="#99a6b5">As the motor speeds up, its back-EMF grows; the loop sees the current falling and raises the voltage to hold it.</text>
</svg>
