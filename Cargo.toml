[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-compile",
    "crates/sim-solve",
    "crates/sim-domain-control",
    "crates/sim-domain-electrical",
    "crates/sim-domain-rotational",
    "crates/sim-domain-translational",
    "crates/sim-domain-bridges",
    "crates/sim-geometry",
    "crates/sim-runtime",
    "crates/sim-test",
    "crates/sim-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/elliot-at-liminalnook/multiphysics-sim"

[workspace.dependencies]
approx = "0.5.1"
bevy = "0.16.1"
clap = { version = "4.5.48", features = ["derive"] }
glam = { version = "0.29.3", features = ["serde"] }
nalgebra = "0.34.1"
petgraph = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
slotmap = { version = "1.0.7", features = ["serde"] }
thiserror = "2.0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
