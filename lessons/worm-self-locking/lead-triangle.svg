<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="IBM Plex Sans">
  <!-- One turn of the worm unrolled, to scale: π·d₁ = 25.13 mm → 520 px (20.69 px/mm).
       Lead L = z₁·π·m: 1.571 mm (1 start) → 32.5 px; 6.283 mm (4 starts) → 130 px. -->
  <rect x="1" y="1" width="758" height="378" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Unroll one turn of the thread and it is a ramp</text>
  <!-- small worm with a thread -->
  <rect x="40" y="62" width="120" height="48" rx="6" fill="#1d2630" stroke="#e6ebf1" stroke-width="1.8"/>
  <g stroke="#4dd4bf" stroke-width="2.2" fill="none">
    <path d="M56,110 L68,62"/><path d="M86,110 L98,62"/><path d="M116,110 L128,62"/><path d="M146,110 L158,62"/>
  </g>
  <text x="100" y="130" font-size="12" fill="#99a6b5" text-anchor="middle">worm, Ø d₁ = 8 mm</text>
  <path d="M170,86 C220,86 230,150 250,190" fill="none" stroke="#99a6b5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M250,190 l-9,-7 l10,-4 z" fill="#99a6b5"/>
  <text x="222" y="112" font-size="12" fill="#99a6b5">unroll</text>
  <!-- base: one circumference -->
  <line x1="60" y1="300" x2="580" y2="300" stroke="#e6ebf1" stroke-width="2.2"/>
  <text x="320" y="326" font-size="14" fill="#e6ebf1" text-anchor="middle">one circumference: π·d₁ = 25.1 mm</text>
  <!-- four starts -->
  <line x1="580" y1="300" x2="580" y2="170" stroke="#de9454" stroke-width="2.2"/>
  <line x1="60" y1="300" x2="580" y2="170" stroke="#de9454" stroke-width="3"/>
  <text x="592" y="222" font-size="13.5" fill="#de9454">lead 6.28 mm</text>
  <text x="592" y="239" font-size="12" fill="#de9454">(4 starts)</text>
  <!-- one start -->
  <line x1="580" y1="300" x2="580" y2="267.5" stroke="#4dd4bf" stroke-width="2.2"/>
  <line x1="60" y1="300" x2="580" y2="267.5" stroke="#4dd4bf" stroke-width="3"/>
  <text x="592" y="280" font-size="13.5" fill="#4dd4bf">lead 1.57 mm</text><text x="592" y="297" font-size="12" fill="#4dd4bf">(1 start)</text>
  <!-- angles -->
  <path d="M300,300 A240,240 0 0 0 299.6,285" fill="none" stroke="#4dd4bf" stroke-width="2"/>
  <text x="360" y="297" font-size="13" fill="#4dd4bf">λ = 3.6°</text>
  <path d="M170,300 A110,110 0 0 0 166.7,273.4" fill="none" stroke="#de9454" stroke-width="2"/>
  <text x="176" y="258" font-size="13" fill="#de9454">λ = 14°</text>
  <!-- formula -->
  <rect x="380" y="62" width="352" height="84" rx="8" fill="#1a2129" stroke="#2e353f"/>
  <text x="556" y="94" font-size="16" fill="#e6ebf1" text-anchor="middle">tan λ = lead / (π·d₁) = z₁·m / d₁</text>
  <text x="556" y="124" font-size="12.5" fill="#99a6b5" text-anchor="middle">z₁ starts, module m = 0.5 mm, pitch diameter d₁</text>
  <text x="24" y="360" font-size="12" fill="#99a6b5">Drawn to scale. More starts: steeper ramp, faster lifting, and easier to push back down.</text>
</svg>
