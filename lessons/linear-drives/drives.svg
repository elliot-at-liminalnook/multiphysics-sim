<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="348" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Three ways to turn rotation into travel, each a ratio G in radians per metre</text>
  <!-- belt -->
  <circle cx="110" cy="130" r="30" fill="#1d2630" stroke="#4dd4bf" stroke-width="3"/>
  <circle cx="110" cy="130" r="4" fill="#e6ebf1"/>
  <line x1="80" y1="130" x2="80" y2="260" stroke="#4dd4bf" stroke-width="3"/>
  <line x1="140" y1="130" x2="140" y2="260" stroke="#4dd4bf" stroke-width="3"/>
  <rect x="128" y="200" width="30" height="24" rx="3" fill="#99a6b5"/>
  <text x="110" y="290" font-size="14" fill="#4dd4bf" text-anchor="middle">belt or rack</text>
  <text x="110" y="312" font-size="14" fill="#e6ebf1" text-anchor="middle">G = 1 / r</text>
  <text x="110" y="332" font-size="12" fill="#99a6b5" text-anchor="middle">GT2 20T: 157 rad/m</text>
  <!-- screw -->
  <rect x="330" y="70" width="18" height="200" fill="#1d2630" stroke="#de9454" stroke-width="2.5"/>
  <g stroke="#de9454" stroke-width="2"><line x1="330" y1="90" x2="348" y2="100"/><line x1="330" y1="120" x2="348" y2="130"/><line x1="330" y1="150" x2="348" y2="160"/><line x1="330" y1="180" x2="348" y2="190"/><line x1="330" y1="210" x2="348" y2="220"/><line x1="330" y1="240" x2="348" y2="250"/></g>
  <rect x="316" y="150" width="46" height="26" rx="3" fill="#99a6b5"/>
  <text x="339" y="290" font-size="14" fill="#de9454" text-anchor="middle">lead screw</text>
  <text x="339" y="312" font-size="14" fill="#e6ebf1" text-anchor="middle">G = 2π / lead</text>
  <text x="339" y="332" font-size="12" fill="#99a6b5" text-anchor="middle">8 mm: 785 rad/m · 2 mm: 3142 rad/m</text>
  <!-- formulas -->
  <rect x="500" y="80" width="236" height="170" rx="8" fill="#1a2129" stroke="#2e353f"/>
  <text x="618" y="116" font-size="16" fill="#e6ebf1" text-anchor="middle">speed  v = ω / G</text>
  <text x="618" y="150" font-size="16" fill="#e6ebf1" text-anchor="middle">force  F = G·τ·η</text>
  <text x="618" y="186" font-size="12.5" fill="#99a6b5" text-anchor="middle">η: belts ≈ 0.95,</text>
  <text x="618" y="204" font-size="12.5" fill="#99a6b5" text-anchor="middle">lead screws 0.3–0.7,</text>
  <text x="618" y="222" font-size="12.5" fill="#99a6b5" text-anchor="middle">ball screws ≈ 0.9</text>
</svg>
