<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="338" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">A supply, a metre of wire, and a board that switches its motor 20 000 times a second</text>
  <!-- supply -->
  <rect x="40" y="110" width="90" height="110" rx="8" fill="#1d2630" stroke="#8fb3e8" stroke-width="2.5"/>
  <text x="85" y="160" font-size="14" fill="#8fb3e8" text-anchor="middle">12 V</text>
  <text x="85" y="180" font-size="12" fill="#99a6b5" text-anchor="middle">supply</text>
  <!-- wire -->
  <line x1="130" y1="130" x2="180" y2="130" stroke="#e6ebf1" stroke-width="2"/>
  <polyline points="180,130 188,118 200,142 212,118 224,142 236,118 244,130" fill="none" stroke="#de9454" stroke-width="2.5"/>
  <text x="212" y="104" font-size="12.5" fill="#de9454" text-anchor="middle">R 0.1 Ω</text>
  <path d="M250,130 q10,-22 20,0 q10,-22 20,0 q10,-22 20,0 q10,-22 20,0" fill="none" stroke="#de9454" stroke-width="2.5"/>
  <text x="290" y="100" font-size="12.5" fill="#de9454" text-anchor="middle">L 1 µH</text>
  <line x1="330" y1="130" x2="420" y2="130" stroke="#e6ebf1" stroke-width="2"/>
  <line x1="130" y1="210" x2="420" y2="210" stroke="#e6ebf1" stroke-width="2"/>
  <text x="275" y="236" font-size="12" fill="#99a6b5" text-anchor="middle">one metre of wire, there and back</text>
  <!-- board -->
  <rect x="400" y="80" width="330" height="190" rx="10" fill="none" stroke="#99a6b5" stroke-dasharray="6 5"/>
  <text x="565" y="100" font-size="12.5" fill="#99a6b5" text-anchor="middle">the board</text>
  <!-- cap -->
  <line x1="450" y1="130" x2="450" y2="160" stroke="#e6ebf1" stroke-width="2"/>
  <line x1="432" y1="160" x2="468" y2="160" stroke="#4dd4bf" stroke-width="3"/>
  <line x1="432" y1="172" x2="468" y2="172" stroke="#4dd4bf" stroke-width="3"/>
  <line x1="450" y1="172" x2="450" y2="210" stroke="#e6ebf1" stroke-width="2"/>
  <text x="450" y="196" font-size="12" fill="#4dd4bf" text-anchor="end" dx="-24">C</text>
  <!-- motor + switch -->
  <line x1="420" y1="130" x2="600" y2="130" stroke="#e6ebf1" stroke-width="2"/>
  <circle cx="600" cy="150" r="18" fill="#1d2630" stroke="#99a6b5" stroke-width="2"/>
  <text x="600" y="155" font-size="13" fill="#e6ebf1" text-anchor="middle">M</text>
  <rect x="585" y="182" width="30" height="16" rx="3" fill="#1d2630" stroke="#f5d24b" stroke-width="2"/>
  <text x="640" y="195" font-size="12" fill="#f5d24b">switch, 20 kHz</text>
  <line x1="600" y1="198" x2="600" y2="210" stroke="#e6ebf1" stroke-width="2"/>
  <line x1="420" y1="210" x2="600" y2="210" stroke="#e6ebf1" stroke-width="2"/>
  <!-- note -->
  <text x="565" y="250" font-size="12.5" fill="#e6ebf1" text-anchor="middle">The switch chops the current 0 → 5 A → 0</text>
  <text x="24" y="300" font-size="12.5" fill="#99a6b5">The wire's resistance costs I·R; its inductance fights every change of current, L·di/dt.</text>
  <text x="24" y="320" font-size="12.5" fill="#99a6b5">A capacitor on the board can supply the pulses locally, so the wire only has to carry the average.</text>
</svg>
