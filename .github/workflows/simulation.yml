name: simulation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  fpga-transaction-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install RTL simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator yosys
      - name: Verify autonomous transaction evidence and stopping
        working-directory: examples/actuators/hx30hm/hardware/2026-09-13-controller-refinement/fpga-control/autonomous-transactions
        run: make sim-experiment-transactions sim-experiment-reply sim-experiment-scheduler
      - name: Verify device event serialization and retained recording
        working-directory: examples/actuators/hx30hm/hardware/2026-09-13-controller-refinement/fpga-control/device-events
        run: make sim-experiment-events sim-experiment-event-stream sim-experiment-recording
      - name: Verify buffered capture overflow preserves evidence
        working-directory: examples/actuators/hx30hm/hardware/2026-09-20-buffered-capture
        run: |
          iverilog -g2012 -s frame_log_overflow_tb -o /tmp/frame-log.vvp firmware/tb/frame_log_overflow_tb.v firmware/src/experiment_frame_log.v
          vvp /tmp/frame-log.vvp
          iverilog -g2012 -s frame_log_overflow_tb -P frame_log_overflow_tb.MODE=1 -o /tmp/frame-log-partial.vvp firmware/tb/frame_log_overflow_tb.v firmware/src/experiment_frame_log.v
          vvp /tmp/frame-log-partial.vvp
      - name: Verify buffered capture through complete UART transactions
        run: node examples/actuators/hx30hm/hardware/2026-09-20-buffered-capture/run.mjs
      - name: Check synthesis module connections
        working-directory: examples/actuators/hx30hm/hardware/2026-09-20-buffered-capture/firmware
        run: yosys -Q -s check-hierarchy.ys
      - name: Verify 400 Hz control with alternate-frame logging and retained faults
        run: node examples/actuators/hx30hm/hardware/2026-09-20-decimated-capture/run.mjs
      - name: Verify sampled logger overflow, partial capture and synthesis connections
        working-directory: examples/actuators/hx30hm/hardware/2026-09-20-decimated-capture
        run: |
          iverilog -g2012 -s frame_log_overflow_tb -o /tmp/sampled-log.vvp firmware/tb/frame_log_overflow_tb.v firmware/src/experiment_frame_log.v
          vvp /tmp/sampled-log.vvp
          iverilog -g2012 -s frame_log_overflow_tb -P frame_log_overflow_tb.MODE=1 -o /tmp/sampled-partial.vvp firmware/tb/frame_log_overflow_tb.v firmware/src/experiment_frame_log.v
          vvp /tmp/sampled-partial.vvp
          cd firmware
          yosys -Q -s check-hierarchy.ys

  generic-runtime:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: System libraries for Bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev
      - name: Python environment client dependencies
        run: python -m pip install numpy
      - name: Check all workspace targets, including the viewer
        run: cargo check --workspace --all-targets --locked
      - name: Generic runtime tests and phenomena acceptance
        # The gallery's separate one-second UI benchmark depends on the host.
        # The CAD job below enforces its own explicit performance budgets.
        run: cargo test --release --workspace --exclude sim-app --locked -- --skip every_exhibit_runs_in_real_time
      - name: Systems viewer retained migration baseline
        run: |
          mkdir -p runs/systems-viewer
          cargo run --release --locked -p sim-compile --example systems_baseline -- --check examples/systems-viewer/evidence/pre-migration-baseline.json > runs/systems-viewer/baseline.json
          cargo run --release --locked -p sim-example-diffusion -- runs/systems-viewer/diffusion.description.json
          cargo run --release --locked -p sim-runtime --example inspect_scene_observations -- examples/full-robot/whole-swing/browser.scene.json > runs/systems-viewer/quadruped-observations.json
      - name: Check the native systems viewer graphics probe
        run: cargo check --locked -p sim-viewer --example host_probe --features native-probe
      - name: Headless systems REST acceptance
        run: |
          cargo build --release --locked -p sim-runtime -p sim-viewer -p sim-api --bin sim-system-worker --bin sim-viewer --bin simctl
          cargo build --release --locked -p sim-spatial
          SIM_REST_BINARY_DIR=target/release cargo run --release --locked -p sim-api --example viewer_rest_smoke -- runs/systems-viewer/rest
      - name: Python controller protocol tests
        env:
          PYTHONPATH: clients/python
        run: python -m unittest discover -s clients/python/tests -q

  cad-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: System libraries for CAD
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Install CAD dependencies
        run: python -m pip install -r cad/requirements.txt
      - name: Build the headless simulator
        run: cargo build --release --locked --bin sim-cad --bin sim-experiment --bin sim-actuator-profiles
      - name: CAD actuator profiles, native validation and archive round trips
        env:
          ROBOCAD_ACTUATOR_PROFILE_TOOL: ${{ github.workspace }}/target/release/sim-actuator-profiles
        run: python -m pytest -q cad/tests/test_actuator_profiles.py
      - name: CAD to controller to measured result
        run: python examples/motorized-pendulum/run.py
      - name: Acceptance checker and controller failure regression tests
        run: python -m pytest -q examples/motorized-pendulum/test_acceptance.py
      - name: Rhai workspace, replay, caching, cancellation and responsiveness
        env:
          SIM_EXPERIMENT_REQUIRED: "1"
          EXPERIMENT_ACK_SECONDS: "0.1"
          EXPERIMENT_CACHED_SECONDS: "6"
          EXPERIMENT_TWO_JOINT_SECONDS: "12"
          EXPERIMENT_THERMAL_SECONDS: "6"
        run: python -m pytest -q examples/experimentation/test_workspace.py --basetemp=runs/experimentation-acceptance
      - name: Atomic candidates, result identity and Qt review controls
        run: python -m pytest -q cad/tests/test_candidates.py cad/tests/test_component_graph.py cad/tests/test_component_derivation.py cad/tests/test_experiment_results.py cad/tests/test_experiment_ui.py cad/tests/test_snapshots.py cad/tests/test_experiment_config.py cad/tests/test_experiment_capture.py cad/tests/test_experiment_process.py cad/tests/test_experiment_recovery.py cad/tests/test_derivation_cache.py
      - name: Save models, traces, controller logs and acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motorized-pendulum
          path: |
            runs/motorized-pendulum/
            runs/experimentation-acceptance/
          if-no-files-found: warn
