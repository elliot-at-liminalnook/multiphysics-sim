<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="IBM Plex Sans">
  <!-- Steady-state amplitude ratio 1/sqrt((1-r²)² + (2ζr)²) for ζ = 0.05 and 0.2, r = f/f_n from 0 to 3. x: 80 + 200·r px; y: 300 − 24·ratio px (ratio 10 → 60). -->
  <rect x="1" y="1" width="758" height="358" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">How much larger the swing is than a steady push would give, against shaking frequency</text>
  <line x1="80" y1="300" x2="700" y2="300" stroke="#99a6b5" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="80" y2="50" stroke="#99a6b5" stroke-width="1.5"/>
  <text x="690" y="324" font-size="13" fill="#99a6b5" text-anchor="end">shaking frequency / natural frequency</text>
  <text x="280" y="320" font-size="12" fill="#99a6b5" text-anchor="middle">1</text>
  <text x="480" y="320" font-size="12" fill="#99a6b5" text-anchor="middle">2</text>
  <text x="680" y="320" font-size="12" fill="#99a6b5" text-anchor="middle">3</text>
  <text x="70" y="280" font-size="12" fill="#99a6b5" text-anchor="end">1×</text>
  <text x="70" y="64" font-size="12" fill="#99a6b5" text-anchor="end">10×</text>
  <line x1="75" y1="276" x2="700" y2="276" stroke="#2e353f" stroke-dasharray="4 4"/>
  <!-- ζ = 0.05 -->
  <polyline fill="none" stroke="#de9454" stroke-width="3" points="80,276 120,275 160,272 200,265 220,259 240,246 250,236 260,215 265,196 270,165 275,114 278,74 280,60 282,74 285,115 290,167 300,219 320,254 360,277 400,285 480,292 580,295 700,297"/>
  <text x="298" y="72" font-size="13" fill="#de9454">ζ = 0.05: about 10× at resonance</text>
  <!-- ζ = 0.2 -->
  <polyline fill="none" stroke="#4dd4bf" stroke-width="3" points="80,276 120,275 160,272 200,264 220,257 240,245 260,227 270,218 280,216 290,219 300,227 320,242 360,265 400,277 480,289 580,294 700,297"/>
  <text x="300" y="206" font-size="13" fill="#4dd4bf">ζ = 0.2: about 2.5×</text>
  <text x="24" y="346" font-size="12.5" fill="#99a6b5">Well below the natural frequency the mount just follows the push; well above, the payload hardly moves; at it, the motion builds up to about 1/(2ζ) times larger.</text>
</svg>
