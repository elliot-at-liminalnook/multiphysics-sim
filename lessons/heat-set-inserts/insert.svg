<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="358" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">What tears when a screw pulls out: a cylinder of plastic around it</text>
  <!-- left boss: self-tapped screw -->
  <rect x="90" y="110" width="200" height="200" fill="#3375b8" fill-opacity="0.35" stroke="#3375b8" stroke-width="2"/>
  <rect x="170" y="70" width="40" height="200" fill="#a3a6ab" stroke="#d5d8dc" stroke-width="2"/>
  <g stroke="#d5d8dc" stroke-width="1.5">
    <line x1="166" y1="130" x2="214" y2="140"/><line x1="166" y1="160" x2="214" y2="170"/><line x1="166" y1="190" x2="214" y2="200"/><line x1="166" y1="220" x2="214" y2="230"/><line x1="166" y1="250" x2="214" y2="260"/>
  </g>
  <rect x="164" y="110" width="52" height="160" fill="none" stroke="#ff7b72" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="190" y="336" font-size="13" fill="#e6ebf1" text-anchor="middle">self-tapped: D ≈ the screw's size</text>
  <!-- right boss: heat-set insert -->
  <rect x="470" y="110" width="200" height="200" fill="#3375b8" fill-opacity="0.35" stroke="#3375b8" stroke-width="2"/>
  <rect x="534" y="110" width="72" height="120" fill="#cc9e40" fill-opacity="0.8" stroke="#e6c36a" stroke-width="2"/>
  <g stroke="#7a5b1c" stroke-width="2"><line x1="534" y1="130" x2="606" y2="140"/><line x1="534" y1="160" x2="606" y2="170"/><line x1="534" y1="190" x2="606" y2="200"/></g>
  <rect x="550" y="70" width="40" height="150" fill="#a3a6ab" stroke="#d5d8dc" stroke-width="2"/>
  <rect x="528" y="110" width="84" height="120" fill="none" stroke="#ff7b72" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="570" y="336" font-size="13" fill="#e6ebf1" text-anchor="middle">heat-set insert: D ≈ the insert's outside</text>
  <!-- pull arrows -->
  <line x1="190" y1="68" x2="190" y2="48" stroke="#f2c14e" stroke-width="3"/><path d="M190,46 l-6,12 l12,0 z" fill="#f2c14e"/>
  <line x1="570" y1="68" x2="570" y2="48" stroke="#f2c14e" stroke-width="3"/><path d="M570,46 l-6,12 l12,0 z" fill="#f2c14e"/>
  <text x="380" y="200" font-size="13" fill="#ff7b72" text-anchor="middle">dashed: the cylinder</text>
  <text x="380" y="218" font-size="13" fill="#ff7b72" text-anchor="middle">that shears (D × L)</text>
</svg>
