name: Native and browser runtime
on:
  push:
    paths: ['crates/**', 'Cargo.*', 'web/**', 'examples/interactive/**', 'examples/full-robot/**', '.github/workflows/browser.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'web/**', 'examples/interactive/**', 'examples/full-robot/**', '.github/workflows/browser.yml']
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix web
      - run: cd web && npx playwright install --with-deps chromium
      - run: cargo test --locked -p sim-runtime --lib --test session
      - run: cargo test --locked -p sim-runtime --test tracking
      - run: cargo test --locked -p sim-runtime --test motion_tracking
      - name: Sampled task-space tracking fixture
        run: cargo run --locked -p sim-runtime --bin sim-track -- compare examples/interactive/tracking/candidate.json examples/interactive/tracking/reference.json examples/interactive/tracking/requirements.json
      - run: cargo test --locked -p sim-compile --test rate_jacobian --test state_row_jacobian
      - run: cargo test --locked -p sim-compile --lib local_fd_tests
      - run: cargo test --locked -p sim-runtime --example compare_matrices
      - run: cargo test --locked -p sim-runtime --example capture_trajectory --example resolve_captured_step
      - run: cargo test --locked -p sim-runtime --example capture_embedded_window
      - run: cargo check --locked -p sim-runtime --example capture_contact_impulses
      - run: cargo check --locked -p sim-runtime --example check_captured_stage
      - run: cargo test --locked -p sim-compile --no-default-features --test rate_jacobian --test state_row_jacobian
      - run: cargo test --locked -p sim-compile --no-default-features --lib local_fd_tests
      - run: cargo test --locked -p sim-solve --lib --test convergence
      - run: cargo test --locked -p sim-solve --test coloring
      - run: cargo test --locked -p sim-runtime --test posture
      - run: cargo test --locked -p sim-domain-control --test trajectory
      - run: cargo test --locked -p sim-domain-control --test neural
      - run: cargo test --locked -p sim-domain-control --test motion_clock --test stepping --test support_preload
      - run: cargo test --locked -p sim-runtime --test step_reference
      - run: cargo test --locked -p sim-runtime --test planning
      - run: cargo test --locked -p sim-runtime --test lift
      - run: cargo test --locked -p sim-runtime --test embedded_session --test task_observation
      - run: cargo test --locked -p sim-runtime --test drive_backlash
      - run: cargo test --locked -p sim-runtime --test environment
      - run: cargo test --locked -p sim-runtime --test residual_policy
      - run: cargo test --locked -p sim-runtime --test neural_policy
      - run: cargo test --locked -p sim-runtime --test body_feedback --test point_feedback
      - run: cargo test --locked -p sim-runtime --lib support::tests
      - run: cargo check --locked -p sim-runtime --example plan_marker_motion --example summarize_marker_clearance --example evaluate_lift
      - run: SIM_SPARSE_FROM=0 cargo test --locked -p sim-solve --test convergence numerical_cache_snapshots_refresh_and_handle_dimension_changes
      - run: cargo test --locked -p sim-dynamics --test jacobian_check
      - run: cargo test --locked -p sim-dynamics --test scheduled_events
      - run: cargo test --locked -p sim-dynamics --test implicit_audit
      - run: cargo test --locked -p sim-dynamics --test hybrid_stepper
      - run: cargo test --locked -p sim-dynamics --test root_order
      - run: cargo test --locked -p sim-dynamics --test step_breakpoints
      - run: cargo test --locked -p sim-domain-sensing --test sensing
      - run: cargo test --locked -p sim-domain-robot --test jacobian
      - run: cargo test --locked -p sim-domain-robot --test constraint_audit
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test constraint_audit
      - run: cargo test --locked -p sim-domain-robot --test transmission_coordinates
      - run: cargo test --locked -p sim-domain-robot --lib --test embedding
      - run: cargo test --locked -p sim-domain-robot --test embedded_step
      - run: cargo test --locked -p sim-domain-robot --test embedded_motor
      - run: cargo test --locked -p sim-domain-robot --test motor_reduction --test motor_jacobian
      - run: cargo test --locked -p sim-domain-robot --lib actuator_audit
      - run: cargo check --locked -p sim-runtime --example audit_actuators
      - run: cargo test --locked -p sim-domain-robot --test servo_clock
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test embedding
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test embedded_step
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test embedded_motor
      - run: cargo check --locked -p sim-runtime --example audit_embedding
      - run: cargo check --locked -p sim-runtime --example audit_analytic_mechanisms
      - run: cargo check --locked -p sim-runtime --example place_supports
      - run: cargo check --locked -p sim-runtime --example integrate_embedding
      - run: cargo test --locked -p sim-runtime --example compare_embedding
      - run: cargo check --locked -p sim-runtime --example compare_motion --example summarize_hold
      - run: cargo test --locked -p sim-domain-robot --test rigid_inertia
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test rigid_inertia
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test transmission_coordinates
      - run: cargo check --locked -p sim-runtime --example compare_transmission_block --example compare_constraint_rows
      - run: cargo test --locked -p sim-domain-robot --test motor_jacobian
      - run: cargo test --locked -p sim-domain-robot --test backlash_events
      - run: cargo test --locked -p sim-domain-robot --lib band_tests
      - run: cargo test --locked -p sim-domain-robot --lib exclusion_tests
      - run: cargo test --locked -p sim-domain-robot --test articulated
      - run: cargo test --locked -p sim-domain-multibody --test regularized_friction
      - run: cargo test --locked -p sim-domain-robot --test regularized_friction
      - run: cargo test --locked -p sim-domain-robot --test floor_dissipation
      - run: cargo test --locked -p sim-runtime --test session floor_dissipation
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test regularized_friction
      - run: cargo test --locked -p sim-domain-robot --no-default-features --test jacobian
      - run: cargo test --locked -p sim-compile --test parallel_jacobian
      - run: cargo test --locked -p sim-compile --no-default-features --test island
      - run: cargo build --locked --release -p sim-web --target wasm32-unknown-unknown
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Package worker and run the native reference
        run: |
          mkdir -p runs/interactive/web
          wasm-bindgen target/wasm32-unknown-unknown/release/sim_web.wasm --target web --out-dir runs/interactive/web
          cp web/worker.js runs/interactive/web/worker.js
          cargo run --locked --release -p sim-runtime --bin sim-session -- examples/interactive/pendulum.scene.json 20 runs/interactive/native.recording.json > runs/interactive/native.frame.json
      - name: Jacobian checks and independent numerical trajectory reference
        run: |
          cargo run --locked --release -p sim-runtime --bin sim-validate -- jacobian examples/interactive/pendulum.scene.json 5 > runs/interactive/jacobian-check.json
          cargo run --locked --release -p sim-runtime --bin sim-validate -- compare runs/interactive/native.recording.json > runs/interactive/jacobian-trajectory-comparison.json
      - name: Browser physics, Rhai control, replay, responsiveness and parity
        run: node web/tests/runtime.mjs runs/interactive/web examples/interactive/pendulum.scene.json runs/interactive/native.frame.json runs/interactive/browser-runtime-report.json
      - name: Interactive viewer with live Rust and Rhai fixture
        run: |
          node web/build-viewer.mjs runs/interactive/viewer --fixture-only
          node web/tests/viewer.mjs runs/interactive/viewer runs/interactive/viewer-report.json
      - name: Incremental motor session native and WASM lifecycle
        run: |
          cargo run --locked --release -p sim-runtime --example integrate_embedding -- examples/interactive/pendulum.scene.json examples/interactive/pendulum.embedded.json > runs/interactive/pendulum-embedded-native.json
          node web/tests/embedded.mjs runs/interactive/viewer pendulum-embedded runs/interactive/pendulum-embedded-native.json runs/interactive/pendulum-embedded-browser.json
      - name: Teacher environment transitions and task replay in native and WASM
        run: |
          cargo run --locked --release -p sim-runtime --example run_environment -- examples/interactive/pendulum.scene.json examples/interactive/pendulum.policy.json examples/interactive/pendulum.environment.json > runs/interactive/pendulum-environment-native.json
          node web/tests/environment.mjs runs/interactive/viewer pendulum-environment runs/interactive/pendulum-environment-native.json runs/interactive/pendulum-environment-browser.json
          target/release/examples/run_environment examples/interactive/pendulum.scene.json examples/interactive/pendulum.policy.json examples/interactive/pendulum.environment.json --profile runs/interactive/pendulum-environment-profile.json > runs/interactive/pendulum-environment-profiled.json
          node examples/interactive/check_profile_capture.mjs runs/interactive/pendulum-environment-native.json runs/interactive/pendulum-environment-profiled.json
      - name: Versioned quadruped environment in native and WASM
        run: |
          node web/build-viewer.mjs runs/interactive/teacher-viewer --environment-only
          cargo run --locked --release -p sim-runtime --example run_environment -- examples/full-robot/teacher-baseline/scene.json examples/full-robot/teacher-baseline/config.json examples/full-robot/teacher-environment.json > runs/interactive/robot-environment-native.json
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-teacher-environment runs/interactive/robot-environment-native.json runs/interactive/robot-environment-browser.json
      - name: Effective-servo browser profile and replay
        run: |
          cargo run --locked --release -p sim-runtime --example run_environment -- examples/full-robot/browser-effective-servo/scene.json examples/full-robot/browser-effective-servo/config.json examples/full-robot/browser-effective-servo/task.json > runs/interactive/effective-servo-native.json
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-effective-servo runs/interactive/effective-servo-native.json runs/interactive/effective-servo-browser.json
      - name: Eight supported crawl swings and native/WASM replay
        run: |
          cargo build --locked --release -p sim-runtime --example evaluate_lift
          target/release/examples/run_environment examples/full-robot/browser-crawl-startup/scene.json examples/full-robot/browser-crawl-startup/config.json examples/full-robot/browser-crawl-startup/task.json > runs/interactive/crawl-native.json
          node examples/full-robot/check_crawl.mjs examples/full-robot/browser-crawl-startup runs/interactive/crawl-native.json runs/interactive/crawl-acceptance
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-crawl-startup runs/interactive/crawl-native.json runs/interactive/crawl-browser.json
          target/release/examples/run_environment examples/full-robot/browser-crawl-startup/scene.json examples/full-robot/browser-crawl-startup/refined.config.json examples/full-robot/browser-crawl-startup/task.json > runs/interactive/crawl-refined-native.json
          node examples/full-robot/compare_effective_servo.mjs runs/interactive/crawl-refined-native.json runs/interactive/crawl-native.json runs/interactive/crawl-refinement.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(readFileSync("runs/interactive/crawl-refinement.json")); assert(Object.values(r.maximum_foot_difference_m).every(x=>x<=0.001)); assert(r.maximum_body_position_difference_m<=0.0005);'
      - name: Online forward commands, support acceptance and WASM replay
        run: |
          target/release/examples/run_environment examples/full-robot/browser-online-steps/scene.json examples/full-robot/browser-online-steps/scheduled-posture-screen.config.json examples/full-robot/browser-online-steps/task.json examples/full-robot/browser-online-steps/forward-stop.actions.json > runs/interactive/online-forward-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/online-forward-native.json runs/interactive/online-forward-acceptance
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-online-steps runs/interactive/online-forward-native.json runs/interactive/online-forward-browser.json
          node web/tests/viewer.mjs runs/interactive/teacher-viewer runs/interactive/online-viewer-report.json
      - name: Reversal gait, collision regression and batched lift checks
        run: |
          target/release/examples/run_environment examples/full-robot/browser-reversal/scene.json examples/full-robot/browser-reversal/short.config.json examples/full-robot/browser-reversal/task.json examples/full-robot/browser-reversal/forward-reverse.actions.json > runs/interactive/reversal-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/reversal-native.json runs/interactive/reversal-acceptance
          node examples/full-robot/check_lift_batch.mjs runs/interactive/reversal-native.json runs/interactive/reversal-acceptance
          target/release/examples/run_environment examples/full-robot/browser-reversal/scene.json examples/full-robot/browser-reversal/short.config.json examples/full-robot/browser-reversal/task.json examples/full-robot/browser-reversal/switch-4.4.actions.json > runs/interactive/reversal-early-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/reversal-early-native.json runs/interactive/reversal-early-acceptance
          target/release/examples/run_environment examples/full-robot/browser-reversal/scene.json examples/full-robot/browser-reversal/short-refined.config.json examples/full-robot/browser-reversal/task.json examples/full-robot/browser-reversal/forward-reverse.actions.json > runs/interactive/reversal-refined-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/reversal-refined-native.json runs/interactive/reversal-refined-acceptance
          node examples/full-robot/compare_effective_servo.mjs runs/interactive/reversal-refined-native.json runs/interactive/reversal-native.json runs/interactive/reversal-refinement.json
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(readFileSync("runs/interactive/reversal-refinement.json")); assert(Object.values(r.maximum_foot_difference_m).every(x=>x<=0.001)); assert(r.maximum_body_position_difference_m<=0.0005);'
      - name: Reversal controller minute in native and WASM
        run: |
          target/release/examples/run_environment examples/full-robot/browser-reversal/scene.json examples/full-robot/browser-reversal/config.json examples/full-robot/browser-reversal/task.json examples/full-robot/browser-reversal/turn-reverse.actions.json > runs/interactive/reversal-long-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/reversal-long-native.json runs/interactive/reversal-long-acceptance
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-reversal-crawl runs/interactive/reversal-long-native.json runs/interactive/reversal-browser.json
      - name: Reduced inter-link forces retain geometry guards and native/WASM behavior
        run: |
          cargo test --locked -p sim-runtime --lib geometric_tests
          target/release/examples/run_environment examples/full-robot/browser-terrain-contact/scene.json examples/full-robot/browser-reversal/config.json examples/full-robot/browser-reversal/task.json examples/full-robot/browser-reversal/turn-reverse.actions.json > runs/interactive/terrain-contact-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/terrain-contact-native.json runs/interactive/terrain-contact-acceptance
          node examples/full-robot/check_inter_link_reduction.mjs runs/interactive/reversal-long-native.json runs/interactive/terrain-contact-native.json
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-terrain-contact runs/interactive/terrain-contact-native.json runs/interactive/terrain-contact-browser.json
          if target/release/examples/run_environment examples/full-robot/browser-terrain-contact/scene.json examples/full-robot/browser-terrain-contact/unsafe-posture.config.json examples/full-robot/browser-reversal/task.json examples/full-robot/browser-reversal/switch-4.4.actions.json > runs/interactive/terrain-contact-rejected.json; then exit 1; fi
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import assert from "node:assert/strict"; const r=JSON.parse(readFileSync("runs/interactive/terrain-contact-rejected.json")); assert.equal(r.completed,false); assert.match(r.error,/reference has internal contact/);'
      - name: Teacher motor corrections preserve baseline physics and run in WASM
        run: |
          target/release/examples/run_environment examples/full-robot/browser-terrain-contact/scene.json examples/full-robot/browser-reversal/short.config.json examples/full-robot/browser-reversal/task.json examples/full-robot/browser-reversal/forward-reverse.actions.json > runs/interactive/residual-baseline-native.json
          target/release/examples/run_environment examples/full-robot/browser-residual-policy/scene.json examples/full-robot/browser-residual-policy/short.config.json examples/full-robot/browser-residual-policy/task.json examples/full-robot/browser-residual-policy/forward-reverse.actions.json > runs/interactive/residual-zero-native.json
          target/release/examples/run_environment examples/full-robot/browser-residual-policy/scene.json examples/full-robot/browser-residual-policy/short.config.json examples/full-robot/browser-residual-policy/task.json examples/full-robot/browser-residual-policy/probe.actions.json > runs/interactive/residual-probe-native.json
          node examples/full-robot/check_residual_policy.mjs runs/interactive/residual-baseline-native.json runs/interactive/residual-zero-native.json runs/interactive/residual-probe-native.json runs/interactive/residual-interface-report.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/residual-zero-native.json runs/interactive/residual-zero-acceptance
          node examples/full-robot/check_online_steps.mjs runs/interactive/residual-probe-native.json runs/interactive/residual-probe-acceptance
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-residual-policy runs/interactive/residual-probe-native.json runs/interactive/residual-browser.json examples/full-robot/browser-residual-policy/short.config.json
      - name: Learned neural teacher artifact, held-out stepping and WASM replay
        run: |
          cargo check --locked -p sim-runtime --example train_residual_policy
          target/release/examples/run_environment examples/full-robot/neural-teacher/scene.json examples/full-robot/neural-teacher/initial.config.json examples/full-robot/neural-teacher/task.json examples/full-robot/neural-teacher/train.actions.json > runs/interactive/neural-zero-native.json
          target/release/examples/run_environment examples/full-robot/neural-teacher/scene.json examples/full-robot/neural-teacher/short.config.json examples/full-robot/neural-teacher/task.json examples/full-robot/neural-teacher/heldout.actions.json > runs/interactive/neural-heldout-native.json
          node examples/full-robot/check_neural_teacher.mjs runs/interactive/residual-zero-native.json runs/interactive/neural-zero-native.json runs/interactive/neural-heldout-native.json runs/interactive/neural-artifact-report.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/neural-heldout-native.json runs/interactive/neural-heldout-acceptance
          target/release/examples/run_environment examples/full-robot/neural-teacher/scene.json examples/full-robot/neural-teacher/config.json examples/full-robot/neural-teacher/task.json examples/full-robot/browser-residual-policy/sustained.actions.json > runs/interactive/neural-sustained-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/neural-sustained-native.json runs/interactive/neural-sustained-acceptance
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-neural-teacher runs/interactive/neural-sustained-native.json runs/interactive/neural-browser.json
      - name: Distilled student held-out stepping and browser replay
        run: |
          cargo check --locked -p sim-runtime --example distill_policy
          target/release/examples/run_environment examples/full-robot/student-distillation/scene.json examples/full-robot/student-distillation/short.config.json examples/full-robot/student-distillation/task.json examples/full-robot/neural-teacher/heldout.actions.json > runs/interactive/student-heldout-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/student-heldout-native.json runs/interactive/student-heldout-acceptance
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs";const c=JSON.parse(readFileSync("examples/full-robot/student-distillation/short.config.json"));delete c.policy.feedback_observations;c.policy.task_observations.floor_forces=true;writeFileSync("runs/interactive/student-full.config.json",JSON.stringify(c));'
          target/release/examples/run_environment examples/full-robot/student-distillation/scene.json runs/interactive/student-full.config.json examples/full-robot/student-distillation/task.json examples/full-robot/neural-teacher/heldout.actions.json > runs/interactive/student-full-native.json
          node examples/full-robot/check_unused_feedback.mjs runs/interactive/student-full-native.json runs/interactive/student-heldout-native.json runs/interactive/student-unused-feedback.json
          target/release/examples/run_environment examples/full-robot/student-distillation/scene.json examples/full-robot/student-distillation/config.json examples/full-robot/student-distillation/task.json examples/full-robot/browser-residual-policy/sustained.actions.json > runs/interactive/student-sustained-native.json
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-distilled-student runs/interactive/student-sustained-native.json runs/interactive/student-browser.json
      - name: Scheduled physical disturbances and WASM replay
        run: |
          cargo test --locked -p sim-domain-robot --test world_load
          cargo test --locked -p sim-domain-robot --test embedded_step world_load_pulse
          cargo test --locked -p sim-runtime --test world_load
          target/release/examples/run_environment examples/full-robot/student-distillation/scene.json examples/full-robot/student-disturbances/lateral.config.json examples/full-robot/student-distillation/task.json examples/full-robot/neural-teacher/train.actions.json > runs/interactive/student-push-native.json
          node examples/full-robot/check_online_steps.mjs runs/interactive/student-push-native.json runs/interactive/student-push-acceptance
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-student-push runs/interactive/student-push-native.json runs/interactive/student-push-browser.json
      - name: Walking objective preserves physics and rejects known bad outcomes
        run: |
          cargo test --locked -p sim-runtime --test walking_task --test lift --test environment
          cargo build --locked --release -p sim-runtime --example rescore_walking
          target/release/examples/run_environment examples/full-robot/student-distillation/scene.json examples/full-robot/student-disturbances/lateral.config.json examples/full-robot/walking-objective/task.json examples/full-robot/neural-teacher/train.actions.json > runs/interactive/walking-task-native.json
          target/release/examples/rescore_walking runs/interactive/student-push-native.json examples/full-robot/walking-objective/walking.json > runs/interactive/walking-task-rescore.json
          node examples/full-robot/check_walking_objective.mjs runs/interactive/student-push-native.json runs/interactive/walking-task-native.json runs/interactive/walking-task-rescore.json runs/interactive/student-push-acceptance/summary.json runs/interactive/walking-task-check.json
          target/release/examples/run_environment examples/full-robot/student-distillation/scene.json examples/full-robot/student-disturbances/stress-15.config.json examples/full-robot/student-distillation/task.json examples/full-robot/neural-teacher/train.actions.json > runs/interactive/walking-stress-original.json
          target/release/examples/rescore_walking runs/interactive/walking-stress-original.json examples/full-robot/walking-objective/walking.json > runs/interactive/walking-stress-rescore.json
          node -e 'const a=require("./runs/interactive/walking-task-rescore.json"),b=require("./runs/interactive/walking-stress-rescore.json"),assert=require("node:assert/strict");assert.equal(a.final.failed_steps,0);assert(b.final.failed_steps>0);assert(a.total_reward>b.total_reward);'
          node web/tests/environment.mjs runs/interactive/teacher-viewer robot-walking-objective runs/interactive/walking-task-native.json runs/interactive/walking-task-browser.json
      - name: Read-only bounded diagnostic capture
        run: |
          cargo build --locked --release -p sim-runtime --example capture_embedded_window
          node examples/interactive/check_capture_window.mjs target/release/examples/capture_embedded_window target/release/examples/integrate_embedding
      - name: Explicit drive-backlash provenance in native and WASM
        run: |
          cargo run --locked --release -p sim-runtime --example integrate_embedding -- examples/interactive/pendulum.drive-backlash.scene.json examples/interactive/pendulum.embedded.json > runs/interactive/drive-backlash-native.json
          node web/tests/embedded.mjs runs/interactive/viewer pendulum-drive-backlash runs/interactive/drive-backlash-native.json runs/interactive/drive-backlash-browser.json
      - name: Condensed detailed motor native and WASM parity
        run: |
