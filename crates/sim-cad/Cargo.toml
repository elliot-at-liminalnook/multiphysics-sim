[package]
name = "sim-cad"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10"
ttf-parser = "0.25.1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
# 3MF meshes (XML inside a zip).
roxmltree = "0.21"
# Step pictures embedded in the assembly guide.
base64 = "0.22"
# Model scripts (`scripts`): the same Rhai the simulation scripts use.
rhai = { version = "1.25.1", features = ["sync", "serde", "metadata"] }
# Print studies, splits, plates and coupons (the print registry, joints, studies).
sim-print = { path = "../sim-print" }
# The assembly guide's step pictures.
sim-render = { path = "../sim-render" }

[dev-dependencies]
sim-domain-robot = { path = "../sim-domain-robot" }
sim-runtime = { path = "../sim-runtime" }

[build-dependencies]
cc = "1.2"
