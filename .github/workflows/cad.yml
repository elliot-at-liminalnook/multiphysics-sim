name: robocad
on:
  push:
    paths: ["cad/**", ".github/workflows/cad.yml"]
  pull_request:
    paths: ["cad/**"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-13, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - run: pip install -r requirements.txt
      - name: Kernel, document, export and parser tests
        run: pytest -q tests --ignore=tests/test_ui.py --ignore=tests/test_experiment_ui.py
      - name: UI smoke tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/test_ui.py tests/test_experiment_ui.py
      - name: Acceptance scenario
        run: python scripts/acceptance.py acceptance_out
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}
          path: cad/acceptance_out
