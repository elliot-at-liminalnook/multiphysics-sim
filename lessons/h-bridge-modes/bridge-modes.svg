<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="328" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Four switches, three ways to stop</text>
  <!-- template for one bridge: rails at y=70 and y=250, legs at x0 and x0+140, motor between at y=160 -->
  <g id="b1">
    <line x1="40" y1="70" x2="220" y2="70" stroke="#de9454" stroke-width="2"/><line x1="40" y1="250" x2="220" y2="250" stroke="#99a6b5" stroke-width="2"/>
    <text x="30" y="74" font-size="11" fill="#de9454" text-anchor="end">+</text>
    <line x1="60" y1="70" x2="60" y2="250" stroke="#2e353f" stroke-width="2"/><line x1="200" y1="70" x2="200" y2="250" stroke="#2e353f" stroke-width="2"/>
    <circle cx="130" cy="160" r="20" fill="#1d2630" stroke="#99a6b5" stroke-width="2"/><text x="130" y="165" font-size="13" fill="#e6ebf1" text-anchor="middle">M</text>
    <line x1="60" y1="160" x2="110" y2="160" stroke="#99a6b5" stroke-width="2"/><line x1="150" y1="160" x2="200" y2="160" stroke="#99a6b5" stroke-width="2"/>
    <!-- brake: both low switches closed (green), highs open -->
    <rect x="52" y="100" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/><rect x="192" y="100" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/>
    <rect x="52" y="190" width="16" height="30" rx="3" fill="#4dd4bf"/><rect x="192" y="190" width="16" height="30" rx="3" fill="#4dd4bf"/>
    <path d="M110,176 Q130,236 150,176" fill="none" stroke="#f5d24b" stroke-width="2.2"/>
    <text x="130" y="290" font-size="15" fill="#4dd4bf" text-anchor="middle">brake</text>
    <text x="130" y="310" font-size="12" fill="#99a6b5" text-anchor="middle">both low switches on: motor shorted</text>
  </g>
  <g transform="translate(250,0)">
    <line x1="40" y1="70" x2="220" y2="70" stroke="#de9454" stroke-width="2"/><line x1="40" y1="250" x2="220" y2="250" stroke="#99a6b5" stroke-width="2"/>
    <line x1="60" y1="70" x2="60" y2="250" stroke="#2e353f" stroke-width="2"/><line x1="200" y1="70" x2="200" y2="250" stroke="#2e353f" stroke-width="2"/>
    <circle cx="130" cy="160" r="20" fill="#1d2630" stroke="#99a6b5" stroke-width="2"/><text x="130" y="165" font-size="13" fill="#e6ebf1" text-anchor="middle">M</text>
    <line x1="60" y1="160" x2="110" y2="160" stroke="#99a6b5" stroke-width="2"/><line x1="150" y1="160" x2="200" y2="160" stroke="#99a6b5" stroke-width="2"/>
    <rect x="52" y="100" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/><rect x="192" y="100" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/>
    <rect x="52" y="190" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/><rect x="192" y="190" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/>
    <text x="130" y="290" font-size="15" fill="#8fb3e8" text-anchor="middle">coast</text>
    <text x="130" y="310" font-size="12" fill="#99a6b5" text-anchor="middle">all off: no path, no current</text>
  </g>
  <g transform="translate(500,0)">
    <line x1="40" y1="70" x2="220" y2="70" stroke="#de9454" stroke-width="2"/><line x1="40" y1="250" x2="220" y2="250" stroke="#99a6b5" stroke-width="2"/>
    <line x1="60" y1="70" x2="60" y2="250" stroke="#2e353f" stroke-width="2"/><line x1="200" y1="70" x2="200" y2="250" stroke="#2e353f" stroke-width="2"/>
    <circle cx="130" cy="160" r="20" fill="#1d2630" stroke="#99a6b5" stroke-width="2"/><text x="130" y="165" font-size="13" fill="#e6ebf1" text-anchor="middle">M</text>
    <line x1="60" y1="160" x2="110" y2="160" stroke="#99a6b5" stroke-width="2"/><line x1="150" y1="160" x2="200" y2="160" stroke="#99a6b5" stroke-width="2"/>
    <rect x="52" y="100" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/><rect x="192" y="100" width="16" height="30" rx="3" fill="#de9454"/>
    <rect x="52" y="190" width="16" height="30" rx="3" fill="#de9454"/><rect x="192" y="190" width="16" height="30" rx="3" fill="#1d2630" stroke="#99a6b5"/>
    <text x="130" y="290" font-size="15" fill="#de9454" text-anchor="middle">reverse ("plug")</text>
    <text x="130" y="310" font-size="12" fill="#99a6b5" text-anchor="middle">supply added to back-EMF</text>
  </g>
</svg>
