<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="338" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Gravity's torque on a leg: weight × horizontal distance from the hip</text>
  <!-- hanging -->
  <circle cx="130" cy="90" r="9" fill="#e6ebf1"/>
  <line x1="130" y1="90" x2="130" y2="220" stroke="#8fb3e8" stroke-width="9" stroke-linecap="round"/>
  <circle cx="130" cy="220" r="12" fill="#8fb3e8"/>
  <line x1="130" y1="232" x2="130" y2="282" stroke="#de9454" stroke-width="2.5"/><path d="M130,288 l-6,-10 l12,0 z" fill="#de9454"/>
  <text x="130" y="312" font-size="14" fill="#e6ebf1" text-anchor="middle">hanging: φ = 0</text>
  <text x="130" y="330" font-size="12.5" fill="#99a6b5" text-anchor="middle">no lever arm, τ = 0</text>
  <!-- 45° -->
  <circle cx="370" cy="90" r="9" fill="#e6ebf1"/>
  <line x1="370" y1="90" x2="462" y2="182" stroke="#8fb3e8" stroke-width="9" stroke-linecap="round"/>
  <circle cx="462" cy="182" r="12" fill="#8fb3e8"/>
  <line x1="462" y1="194" x2="462" y2="250" stroke="#de9454" stroke-width="2.5"/><path d="M462,256 l-6,-10 l12,0 z" fill="#de9454"/>
  <line x1="370" y1="262" x2="462" y2="262" stroke="#4dd4bf" stroke-width="2.5"/>
  <line x1="370" y1="90" x2="370" y2="270" stroke="#99a6b5" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="416" y="282" font-size="12.5" fill="#4dd4bf" text-anchor="middle">r·sin φ</text>
  <text x="400" y="312" font-size="14" fill="#e6ebf1" text-anchor="middle">φ = 45°</text>
  <text x="400" y="330" font-size="12.5" fill="#99a6b5" text-anchor="middle">τ = 0.71 × the most</text>
  <!-- level -->
  <circle cx="560" cy="120" r="9" fill="#e6ebf1"/>
  <line x1="560" y1="120" x2="690" y2="120" stroke="#8fb3e8" stroke-width="9" stroke-linecap="round"/>
  <circle cx="690" cy="120" r="12" fill="#8fb3e8"/>
  <line x1="690" y1="132" x2="690" y2="188" stroke="#de9454" stroke-width="2.5"/><path d="M690,194 l-6,-10 l12,0 z" fill="#de9454"/>
  <line x1="560" y1="210" x2="690" y2="210" stroke="#4dd4bf" stroke-width="2.5"/>
  <text x="625" y="230" font-size="12.5" fill="#4dd4bf" text-anchor="middle">r</text>
  <text x="625" y="312" font-size="14" fill="#e6ebf1" text-anchor="middle">level: φ = 90°</text>
  <text x="625" y="330" font-size="12.5" fill="#99a6b5" text-anchor="middle">the most: τ = m·g·r</text>
  <text x="704" y="176" font-size="12.5" fill="#de9454">m·g</text>
</svg>
