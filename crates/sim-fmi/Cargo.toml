[package]
name = "sim-fmi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FMI 3.0 Co-Simulation FMUs as blocks: import, validate, execute"

[dependencies]
libloading = "0.8"
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sim-compile = { path = "../sim-compile" }
sim-core = { path = "../sim-core" }
tempfile = "3"
thiserror.workspace = true
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
sim-dynamics = { path = "../sim-dynamics" }
sim-runtime = { path = "../sim-runtime" }
sim-domain-thermal = { path = "../sim-domain-thermal" }
sim-domain-rotational = { path = "../sim-domain-rotational" }
sim-domain-control = { path = "../sim-domain-control" }
