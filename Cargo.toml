[workspace]
resolver = "2"
members = [
    "crates/sim-core",
    "crates/sim-script",
    "crates/sim-compile",
    "crates/sim-solve",
    "crates/sim-domain-control",
    "crates/sim-domain-sensing",
    "crates/sim-couple",
    "crates/sim-domain-electrical",
    "crates/sim-domain-rotational",
    "crates/sim-domain-translational",
    "crates/sim-domain-bridges",
    "crates/sim-domain-multibody",
    "crates/sim-domain-magnetic",
    "crates/sim-domain-chemical",
    "crates/sim-domain-radiative",
    "crates/sim-domain-line",
    "crates/sim-domain-granular",
    "crates/sim-domain-robot",
    "crates/sim-geometry",
    "crates/sim-dynamics",
    "crates/sim-domain-thermal",
    "crates/sim-domain-hydraulic",
    "crates/sim-domain-acoustic",
    "crates/sim-domain-fluid",
    "crates/sim-phenomena",
    "crates/sim-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/elliot-at-liminalnook/multiphysics-sim"

[workspace.dependencies]
approx = "0.5.1"
bevy = "0.16.1"
clap = { version = "4.5.48", features = ["derive"] }
glam = { version = "0.29.3", features = ["serde"] }
nalgebra = "0.34.1"
petgraph = "0.8.2"
proptest = "1.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }
slotmap = { version = "1.0.7", features = ["serde"] }
thiserror = "2.0.17"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
