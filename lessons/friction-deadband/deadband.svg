<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="358" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Steady speed against the drive command: two kinds of friction</text>
  <!-- axes -->
  <line x1="80" y1="190" x2="700" y2="190" stroke="#99a6b5" stroke-width="1.5"/>
  <line x1="390" y1="60" x2="390" y2="320" stroke="#99a6b5" stroke-width="1.5"/>
  <text x="704" y="195" font-size="13" fill="#99a6b5">command</text>
  <text x="398" y="68" font-size="13" fill="#99a6b5">speed</text>
  <!-- no friction: line through origin -->
  <line x1="130" y1="300" x2="650" y2="80" stroke="#99a6b5" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="560" y="96" font-size="12.5" fill="#99a6b5">no friction</text>
  <!-- dry friction: dead band then parallel lines -->
  <line x1="130" y1="280" x2="330" y2="190" stroke="#4dd4bf" stroke-width="3.2"/>
  <line x1="330" y1="190" x2="450" y2="190" stroke="#4dd4bf" stroke-width="5"/>
  <line x1="450" y1="190" x2="650" y2="100" stroke="#4dd4bf" stroke-width="3.2"/>
  <text x="600" y="140" font-size="13" fill="#4dd4bf">dry friction</text>
  <!-- dead band bracket -->
  <line x1="330" y1="210" x2="450" y2="210" stroke="#de9454" stroke-width="2"/>
  <line x1="330" y1="203" x2="330" y2="217" stroke="#de9454" stroke-width="2"/>
  <line x1="450" y1="203" x2="450" y2="217" stroke="#de9454" stroke-width="2"/>
  <text x="390" y="236" font-size="14" fill="#de9454" text-anchor="middle">dead band</text>
  <text x="390" y="256" font-size="12" fill="#de9454" text-anchor="middle">|command| &lt; R·τ_f / (k·V)</text>
  <!-- note -->
  <rect x="80" y="70" width="230" height="74" rx="8" fill="#1a2129" stroke="#2e353f"/>
  <text x="96" y="98" font-size="13" fill="#e6ebf1">Dry friction: a constant τ_f</text>
  <text x="96" y="120" font-size="13" fill="#e6ebf1">Viscous friction: c·ω</text>
  <text x="96" y="138" font-size="11.5" fill="#99a6b5">(tilts the lines, no dead band)</text>
  <text x="24" y="342" font-size="12.5" fill="#99a6b5">Dry friction cuts a flat gap out of the line around zero and shifts both halves outward. Inside it, the motor pushes but nothing moves.</text>
</svg>
