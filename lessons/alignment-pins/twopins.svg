<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Sans">
  <rect x="1" y="1" width="758" height="298" rx="12" fill="#141a21" stroke="#2e353f"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#e6ebf1">Two round pins fix the same direction twice: a spacing error e has nowhere to go</text>
  <rect x="60" y="110" width="640" height="60" fill="#ed8c29" fill-opacity="0.3" stroke="#ed8c29" stroke-width="2"/>
  <text x="76" y="100" font-size="13" fill="#ed8c29">plate: round holes 60 mm apart</text>
  <circle cx="200" cy="140" r="22" fill="#141a21" stroke="#ed8c29" stroke-width="2"/>
  <circle cx="200" cy="140" r="19" fill="#a3a6ab" stroke="#d5d8dc" stroke-width="2"/>
  <circle cx="560" cy="140" r="22" fill="#141a21" stroke="#ed8c29" stroke-width="2"/>
  <circle cx="574" cy="140" r="19" fill="#a3a6ab" stroke="#d5d8dc" stroke-width="2"/>
  <text x="200" y="200" font-size="13" fill="#d5d8dc" text-anchor="middle">pin 1</text>
  <text x="574" y="200" font-size="13" fill="#d5d8dc" text-anchor="middle">pin 2: 60 mm + e from pin 1</text>
  <path d="M560,236 l0,-10 M574,236 l0,-10 M560,232 L574,232" stroke="#e6ebf1" stroke-width="1.6" fill="none"/>
  <text x="567" y="256" font-size="14" fill="#e6ebf1" text-anchor="middle">e</text>
  <text x="380" y="286" font-size="13" fill="#9fb3c8" text-anchor="middle">Fix: make one hole a slot along the line between the pins, so it locates only across that line.</text>
</svg>
